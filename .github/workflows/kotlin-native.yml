name: Verify Kotlin standalone APK
on:
  push:
    branches: ['codex/kotlin-standalone']
    tags: ['kotlin-v*']
  pull_request:
    paths: ['kotlin-tv/**', 'scripts/build-kotlin.sh', '.github/workflows/kotlin-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Unit tests, Android lint, and installable development APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/kotlin-v* ]]; then
            version="${GITHUB_REF_NAME#kotlin-v}"
          else
            version="0.8.1"
          fi
          # 动态计算 versionCode：去掉点号，如果不够则补0（如 2.1.8 -> 218，2.1.10 -> 2110）
          versionCode=$(echo "$version" | tr -d '.')
          if [[ ${#versionCode} -lt 3 ]]; then
            versionCode="${versionCode}0"
          fi
          export HONGGUOTV_VERSION_CODE="$versionCode"
          export HONGGUOTV_VERSION_NAME="$version"
          echo "HONGGUOTV_VERSION_CODE=$HONGGUOTV_VERSION_CODE" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=$HONGGUOTV_VERSION_NAME" >> "$GITHUB_ENV"
          # 配置了 Gitee 镜像仓库（仓库变量 GITEE_REPO=owner/repo）时，把镜像地址编进 APK，更新时优先走 Gitee。
          if [[ -n "${GITEE_REPO:-}" ]]; then
            export HONGGUOTV_GITEE_MIRROR="https://gitee.com/$GITEE_REPO"
            echo "HONGGUOTV_GITEE_MIRROR=$HONGGUOTV_GITEE_MIRROR" >> "$GITHUB_ENV"
            echo "Gitee 镜像：$HONGGUOTV_GITEE_MIRROR"
          fi
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintTvDebug :app:lintPhoneDebug :app:assembleDebug :app:assembleRelease --console=plain
      - name: Prepare tagged APK
        if: startsWith(github.ref, 'refs/tags/kotlin-v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#kotlin-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tv_apk="juyingtv-${version}-v7a.apk"
          phone_apk="juying-${version}-v8a.apk"
          echo "TV_APK=$tv_apk" >> "$GITHUB_ENV"
          echo "PHONE_APK=$phone_apk" >> "$GITHUB_ENV"
          mv kotlin-tv/app/build/outputs/apk/tv/release/app-tv-release.apk "$tv_apk"
          mv kotlin-tv/app/build/outputs/apk/phone/release/app-phone-release.apk "$phone_apk"
          tv_size=$(stat -c%s "$tv_apk"); tv_sha=$(sha256sum "$tv_apk" | awk '{print $1}')
          ph_size=$(stat -c%s "$phone_apk"); ph_sha=$(sha256sum "$phone_apk" | awk '{print $1}')
          min_sdk=$(grep -oE 'minSdk *= *[0-9]+' kotlin-tv/app/build.gradle.kts | grep -oE '[0-9]+' | head -n1)
          [[ "$min_sdk" =~ ^[0-9]+$ ]]
          # Release notes come from CHANGELOG.md: the section whose heading matches this tag's version.
          notes=$(awk -v version="$version" '
            /^##[[:space:]]/ {
              if (started) exit
              heading=$0
              sub(/^##[[:space:]]+/,"",heading); gsub(/[][]/,"",heading)
              sub(/[[:space:]].*$/,"",heading); sub(/^v/,"",heading)
              if (heading==version) { started=1; next }
            }
            started { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)
          if [[ -z "$notes" ]]; then
            notes="橘影TV ${version}"
          else
            printf '%s\n' "$notes" > release-notes.md
            echo "RELEASE_NOTES_FILE=release-notes.md" >> "$GITHUB_ENV"
          fi
          if command -v jq >/dev/null 2>&1; then
            notes_json=$(printf '%s' "$notes" | jq -Rsc .)
          else
            notes_json=$(printf '%s' "$notes" | python3 -c 'import json,sys; sys.stdout.write(json.dumps(sys.stdin.read()))')
          fi
          printf '{"schema":1,"packageName":"com.hongguotv.nativeapp","versionCode":%s,"versionName":"%s","minSdk":%s,"tag":"%s","apk":{"name":"%s","size":%s,"sha256":"%s"},"notes":%s}\n' \
            "$HONGGUOTV_VERSION_CODE" "$version" "$min_sdk" "$VERSION" "$tv_apk" "$tv_size" "$tv_sha" "$notes_json" > update.json
          printf '{"schema":1,"packageName":"com.hongguotv.phone","versionCode":%s,"versionName":"%s","minSdk":%s,"tag":"%s","apk":{"name":"%s","size":%s,"sha256":"%s"},"notes":%s}\n' \
            "$HONGGUOTV_VERSION_CODE" "$version" "$min_sdk" "$VERSION" "$phone_apk" "$ph_size" "$ph_sha" "$notes_json" > update-phone.json
          sha256sum "$tv_apk" "$phone_apk" update.json update-phone.json > SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/kotlin-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#kotlin-v}"
          notes_args=(--generate-notes)
          if [[ -n "${RELEASE_NOTES_FILE:-}" && -s "${RELEASE_NOTES_FILE}" ]]; then
            previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [[ -n "$previous" ]]; then
              printf '\n完整变更：https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$TAG" >> "$RELEASE_NOTES_FILE"
            fi
            notes_args=(--notes-file "$RELEASE_NOTES_FILE")
          fi
          gh release create "$TAG" "$TV_APK" "$PHONE_APK" update.json update-phone.json SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "橘影 ${version}" \
            "${notes_args[@]}"
      # 可选：同步到 Gitee 镜像（仓库变量 GITEE_REPO=owner/repo，密钥 GITEE_TOKEN）。任何失败都不影响 GitHub 发版。
      - name: Mirror release to Gitee (optional)
        if: startsWith(github.ref, 'refs/tags/kotlin-v') && vars.GITEE_REPO != ''
        continue-on-error: true
        env:
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${GITEE_TOKEN:-}" ]]; then echo "未配置 GITEE_TOKEN，跳过 Gitee 镜像"; exit 0; fi
          api="https://gitee.com/api/v5/repos/$GITEE_REPO"
          version="${GITHUB_REF_NAME#kotlin-v}"
          notes="$(cat release-notes.md 2>/dev/null || echo "橘影TV $version")"
          curl -sS -X POST "$api/releases" \
            -d "access_token=$GITEE_TOKEN" -d "tag_name=$GITHUB_REF_NAME" \
            -d "target_commitish=main" -d "name=橘影 $version" \
            --data-urlencode "body=$notes" -o /tmp/gitee_release.json -w "\nHTTP_CODE:%{http_code}\n" || true
          echo "Gitee create release response:"; cat /tmp/gitee_release.json 2>/dev/null || echo "(empty)"
          id="$(python3 -c 'import json;print(json.load(open("/tmp/gitee_release.json")).get("id",""))' 2>/dev/null || true)"
          if [[ -z "$id" ]]; then
            echo "创建失败，尝试查询已有 release..."
            curl -sS "$api/releases/tags/$GITHUB_REF_NAME?access_token=$GITEE_TOKEN" -o /tmp/gitee_query.json -w "\nHTTP_CODE:%{http_code}\n" || true
            echo "Gitee query release response:"; cat /tmp/gitee_query.json 2>/dev/null || echo "(empty)"
            id="$(python3 -c 'import json,sys;print(json.load(open("/tmp/gitee_query.json")).get("id",""))' 2>/dev/null || true)"
          fi
          if [[ -z "$id" ]]; then echo "Gitee release 创建/查询失败，跳过"; exit 0; fi
          for f in "$TV_APK" "$PHONE_APK" SHA256SUMS; do
            [[ -f "$f" ]] || continue
            curl -sS -X POST "$api/releases/$id/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@$f" -o /dev/null \
              || echo "上传 $f 到 Gitee 失败（忽略）"
          done
          for f in update.json update-phone.json; do
            [[ -f "$f" ]] || continue
            sha="$(curl -sS "$api/contents/$f?access_token=$GITEE_TOKEN" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || true)"
            content="$(base64 -w0 "$f")"
            if [[ -n "$sha" ]]; then
              curl -sS -X POST "$api/contents/$f" -d "access_token=$GITEE_TOKEN" -d "message=发布 $version" -d "content=$content" -d "sha=$sha" -o /dev/null \
                || echo "更新 $f 到 Gitee 失败（忽略）"
            else
              curl -sS -X POST "$api/contents/$f" -d "access_token=$GITEE_TOKEN" -d "message=发布 $version" -d "content=$content" -o /dev/null \
                || echo "提交 $f 到 Gitee 失败（忽略）"
            fi
          done
          echo "Gitee 镜像完成：$GITEE_REPO $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-tvDebug.*
            kotlin-tv/app/build/reports/lint-results-phoneDebug.*
            kotlin-tv/app/build/outputs/apk/tv/debug/*.apk
            kotlin-tv/app/build/outputs/apk/phone/debug/*.apk
            kotlin-tv/app/build/outputs/apk/tv/release/*.apk
            kotlin-tv/app/build/outputs/apk/phone/release/*.apk
            kotlin-tv/app/build/outputs/mapping/tvRelease/mapping.txt
            kotlin-tv/app/build/outputs/mapping/phoneRelease/mapping.txt
